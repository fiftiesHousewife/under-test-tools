# yaml-language-server: $schema=../schema/backlog-seed.schema.json
# Work on under-test-tools itself: its releases, decisions and set-up. Synced to this repo's issues by
# .github/workflows/sync-backlog.yml. A new sub-command is an item in under-test's backlog, beside its skill.
# Items refer to each other by key (a descriptive name). Words follow under-test's GLOSSARY.md.

items:
  - key: "this-repo-keeps-itself-in-order"
    type: "outcome"
    title: "under-test-tools keeps itself in order: its checks, CI, decisions and releases"
    phase: "set-up"
    horizon: "now"
    owner_role: "Toolkit Owner"
    done_by: "person"
    done_when:
      - "Every item under it is done"
  - key: "release-0-1-0"
    type: "deliverable"
    title: "under-test-tools 0.1.0 is released: a signed jar with its bill of materials and checksums, beside the tag v0.1.0"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Toolkit Owner"
    done_by: "person"
    done_when:
      - "The repository has the secrets SIGNING_KEY and SIGNING_KEY_PASSWORD, and the key's public half is published"
      - "maintainer-tools/release/release.sh 0.1.0 has run, and the release workflow passed"
      - "The GitHub release v0.1.0 holds the jar, its bill of materials, a signature of each and SHA256SUMS"
      - "under-test's skills that run the tool name 0.1.0"
  - key: "assistants-find-this-repos-skills"
    status: "done"
    type: "task"
    title: "Claude Code finds this repo's skills: .claude/skills links to each skill in .github/skills"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Toolkit Owner"
    done_by: "person"
    done_when:
      - ".claude/skills/add-a-sub-command, work-on-an-item and write-a-decision-record are links to .github/skills, committed"
      - "apm install has installed the grilling and architecture-decision-records skills"
  - key: "decide-sub-commands-do-only-what-a-program-decides"
    status: "done"
    type: "decision"
    title: "under-test-tools does only what a program can decide the same way every time, and the judgement stays in under-test's skills"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0001-under-test-tools-does-only-what-a-program-can-decide-the-same-way-every-time-and-the-judgement-stays-in-under-tests-skills.md"
  - key: "decide-files-follow-under-tests-schemas"
    status: "done"
    type: "decision"
    title: "Each sub-command writes the toolkit's files exactly as their schemas in under-test say, changing only the fields its skill owns"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0002-each-sub-command-writes-the-toolkits-files-exactly-as-their-schemas-in-under-test-say-changing-only-the-fields-its-skill-owns.md"
  - key: "decide-every-behaviour-has-a-case"
    status: "done"
    type: "decision"
    title: "Every behaviour has a case, in an example repo of known answers or a test of its own, and a fault found on a real repo gets a case before it is fixed"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0003-every-behaviour-has-a-case-in-an-example-repo-of-known-answers-or-a-test-of-its-own-and-a-fault-found-on-a-real-repo-gets-a-case-before-it-is-fixed.md"
  - key: "decide-output-is-the-same-byte-for-byte"
    status: "done"
    type: "decision"
    title: "The same inputs give the same files, byte for byte"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0004-the-same-inputs-give-the-same-files-byte-for-byte.md"
  - key: "decide-the-tool-runs-none-of-a-repos-code"
    status: "done"
    type: "decision"
    title: "It reads a repo's files and runs none of the repo's code, writing only under the repo's testing folder"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0005-it-reads-a-repos-files-and-runs-none-of-the-repos-code-writing-only-under-the-repos-testing-folder.md"
  - key: "decide-one-jar-on-java-17"
    status: "done"
    type: "decision"
    title: "The tool is one runnable jar holding its libraries, built with Java 25 and running on Java 17 and later"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0006-the-tool-is-one-runnable-jar-holding-its-libraries-built-with-java-25-and-running-on-java-17-and-later.md"
  - key: "decide-pmd-runs-in-the-tool"
    status: "done"
    type: "decision"
    title: "PMD runs inside the tool as a library, with under-test's rules"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0007-pmd-runs-inside-the-tool-as-a-library-with-under-tests-rules.md"
  - key: "decide-the-java-conventions-plugin"
    status: "done"
    type: "decision"
    title: "The code follows the java-conventions plugin's standards, applied at a pinned version"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Records what the repo already does"
    decision_record: "docs/decisions/0008-the-code-follows-the-java-conventions-plugins-standards-applied-at-a-pinned-version.md"
  - key: "decide-the-backlog-syncs-to-the-issues"
    type: "decision"
    title: "This repo's backlog is plan/under-test-tools-backlog.yaml, synced to its issues by under-test's shared workflow after each push"
    parent: "this-repo-keeps-itself-in-order"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "Chosen by the under-test-tools maintainers, and the record marked accepted"
    decision_record: "docs/decisions/0009-this-repos-backlog-is-plan-under-test-tools-backlog-yaml-synced-to-its-issues-by-under-tests-shared-workflow-after-each-push.md"
