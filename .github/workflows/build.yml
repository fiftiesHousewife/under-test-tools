# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Runs every check on each push to main and each pull request, and builds what a release would publish. The release
# workflow runs it too, before it publishes anything.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run all checks, and build the jar and its bill of materials
        run: ./gradlew check releaseFiles
